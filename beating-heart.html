<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💗</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #2a0a1a 0%, #100008 70%, #000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "PingFang SC", sans-serif;
    }

    .stage {
      position: relative;
      text-align: center;
      user-select: none;
    }

    /* 跳动的爱心 */
    .heart {
      font-size: 22vmin;
      line-height: 1;
      display: inline-block;
      animation: beat 1s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(255, 70, 130, 0.7));
      cursor: pointer;
    }

    /* 心跳节奏：lub-dub 双跳 */
    @keyframes beat {
      0%   { transform: scale(1);    }
      14%  { transform: scale(1.25); }
      28%  { transform: scale(1);    }
      42%  { transform: scale(1.18); }
      70%  { transform: scale(1);    }
      100% { transform: scale(1);    }
    }

    /* 光晕脉冲 */
    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 30vmin;
      height: 30vmin;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 60, 120, 0.45) 0%, transparent 65%);
      border-radius: 50%;
      animation: pulse 1s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes pulse {
      0%   { opacity: 0.4; transform: translate(-50%, -50%) scale(0.9); }
      14%  { opacity: 0.9; transform: translate(-50%, -50%) scale(1.3); }
      70%  { opacity: 0.4; transform: translate(-50%, -50%) scale(0.9); }
      100% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.9); }
    }

    .caption {
      margin-top: 4vmin;
      color: #ff9bbd;
      font-size: 3.5vmin;
      letter-spacing: 0.3em;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <div class="heart">💗</div>
    <div class="caption">怦然心动</div>
  </div>

  <script>
    // 点击爱心时迸发小心心
    const heart = document.querySelector('.heart');
    heart.addEventListener('click', (e) => {
      for (let i = 0; i < 8; i++) {
        const p = document.createElement('div');
        p.textContent = '💗';
        p.style.position = 'fixed';
        p.style.left = e.clientX + 'px';
        p.style.top = e.clientY + 'px';
        p.style.fontSize = (12 + Math.random() * 18) + 'px';
        p.style.pointerEvents = 'none';
        p.style.transition = 'transform 1s ease-out, opacity 1s ease-out';
        p.style.zIndex = 10;
        document.body.appendChild(p);

        const angle = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 120;
        requestAnimationFrame(() => {
          p.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist - 80}px) scale(0.3)`;
          p.style.opacity = '0';
        });
        setTimeout(() => p.remove(), 1000);
      }
    });
  </script>
</body>
</html>
